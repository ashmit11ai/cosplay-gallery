<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <title>🌸 Cosplay Waifu Zone 🌸</title>
    <!-- Import cute, rounded Google Fonts for a gorgeous kawaii anime aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style type="text/css" media="all">
      body {
        background-color: #f7dff0;
        /* Kawaii pastel polka-dot grid design background texture overlay */
        background-image: radial-gradient(#fff 20%, transparent 20%), radial-gradient(#fff 20%, transparent 20%);
        background-size: 40px 40px;
        background-position: 0 0, 20px 20px;
        font-family: 'Quicksand', sans-serif;
        margin: 0;
        padding: 20px;
        color: #6d5b6b;
      }
      
      h1, h2 {
        font-family: 'Mochiy Pop One', sans-serif;
        text-align: center;
        color: #ff7ebb;
        text-shadow: 2px 2px 0px #fff;
        margin-bottom: 5px;
        text-decoration: none;
      }

      h1 { font-size: 2.5rem; margin-top: 10px; }
      h2 { font-size: 1.2rem; color: #a491a2; font-weight: normal; margin-bottom: 20px; }

      .kawaii-divider {
        text-align: center;
        margin: 10px auto 20px auto;
        color: #ff9ebb;
        font-size: 18px;
        letter-spacing: 5px;
      }

      /* Core side-by-side positioning container */
      .main-layout {
        display: flex;
        gap: 25px;
        max-width: 1350px;
        margin: 0 auto;
        align-items: flex-start;
      }

      /* Thumbnail grid container */
      .row {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 15px;
        flex: 1.2;
      }

      /* Card styles for thumbnail blocks */
      .column {
        background: rgba(255, 255, 255, 0.6);
        border: 3px dashed #ffb7d5;
        border-radius: 20px;
        padding: 8px;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0,0,0,0.01);
      }

      .column:hover {
        border-style: solid;
        border-color: #ff7ebb;
        background: #fff;
        transform: translateY(-4px);
      }

      /* Thumbnail image styles */
      .column img {
        width: 100%;
        height: auto;
        cursor: pointer;
        opacity: 0.8;
        transition: transform 0.2s, opacity 0.2s;
        border-radius: 12px;
      }

      .column img:hover {
        opacity: 1;
        transform: scale(1.05);
      }

      /* Right Sidebar Layout Track */
      .right-sidebar {
        position: sticky;
        top: 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* Kawaii Cherry-Blossom theme Decorated Biodata Card */
      .biodata-card {
        background: rgba(255, 255, 255, 0.85);
        border: 4px solid #fff;
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 8px 20px rgba(247, 191, 220, 0.4);
        position: relative;
        overflow: hidden;
      }

      .biodata-card::before {
        content: "🌸";
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 20px;
        opacity: 0.7;
      }
      .biodata-card::after {
        content: "✨";
        position: absolute;
        bottom: 10px;
        right: 10px;
        font-size: 20px;
        opacity: 0.7;
      }

      .biodata-title {
        font-family: 'Mochiy Pop One', sans-serif;
        font-size: 1.1rem;
        color: #ff6ba9;
        text-align: center;
        margin-top: 0;
        margin-bottom: 15px;
        border-bottom: 2px dotted #ffb7d5;
        padding-bottom: 8px;
      }

      .biodata-grid {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px 15px;
        font-size: 15px;
      }

      .bio-label {
        font-weight: bold;
        color: #ff7ebb;
        text-align: right;
      }

      .bio-val {
        color: #6d5b6b;
      }

      /* Right Expanded Image Display Box */
      .container {
        display: none;
        background: rgba(255, 255, 255, 0.85);
        border: 4px solid #fff;
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 8px 20px rgba(247, 191, 220, 0.4);
        text-align: center;
        position: relative;
      }

      #expandedImg {
        max-width: 100%;
        height: auto;
        max-height: 52vh;
        border-radius: 16px;
        display: block;
        margin: 0 auto;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      }

      #imgtext {
        font-family: 'Mochiy Pop One', sans-serif;
        margin-top: 15px;
        color: #ff6ba9;
        font-size: 15px;
      }

      .closebtn {
        position: absolute;
        top: 8px;
        right: 18px;
        color: #ff9ebb;
        font-size: 35px;
        cursor: pointer;
        transition: color 0.2s, transform 0.2s;
        line-height: 1;
        z-index: 5;
      }
      
      .closebtn:hover {
        color: #ff4791;
        transform: scale(1.1);
      }
    </style>
  </head>

    </div>

    <script type="text/javascript" charset="utf-8">
    function myFunction(imgs) {
      var expandImg = document.getElementById("expandedImg");
      var imgText = document.getElementById("imgtext");
      var previewContainer = document.getElementById("previewContainer");
      
      // Update preview photo and label element text
      expandImg.src = imgs.src;
      imgText.innerHTML = imgs.alt;
      
      // Live-update specific dataset attributes to match the selected image element properties
      document.getElementById("bioName").innerHTML = imgs.getAttribute("data-name") || "Click an image! 💕";
      document.getElementById("bioHeight").innerHTML = imgs.getAttribute("data-height") || "--";
      document.getElementById("bioLikes").innerHTML = imgs.getAttribute("data-likes") || "--";
      document.getElementById("bioHobby").innerHTML = imgs.getAttribute("data-hobby") || "--";
      document.getElementById("bioStatus").innerHTML = imgs.getAttribute("data-status") || "--";
      
      // Reveal the container element seamlessly
      previewContainer.style.display = "block";
    }

    function closePreview() {
      // Hide the expand view box channel seamlessly
      document.getElementById("previewContainer").style.display = 'none';
      
      // Wipe character variables string tracks back onto clean baseline placeholders
      document.getElementById("bioName").innerHTML = "Click an image! 💕";
      document.getElementById("bioHeight").innerHTML = "--";
      document.getElementById("bioLikes").innerHTML = "--";
      document.getElementById("bioHobby").innerHTML = "--";
      document.getElementById("bioStatus").innerHTML = "--";
    }
    </script>
